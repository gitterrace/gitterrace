# cliff.toml, git-cliff configuration for the gitterrace changelog.
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is generated at release time by `make changelog VERSION=x.y.z`. Do not edit a
# released section by hand: the changelog lint compares the file with this output.

[changelog]
header = """
# Changelog

All notable changes are listed here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses
[Semantic Versioning](https://semver.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
{% if commit.scope %}{% set_global m = commit.scope ~ ": " ~ commit.message %}\
{% else %}{% set_global m = commit.message | upper_first %}{% endif %}\
{% set_global col = 2 %}- \
{% for w in m | split(pat=" ") %}\
{% set n = w | length %}{% if not loop.first and col + 1 + n > 80 %}
{{ "  " }}{% set_global col = 2 %}\
{% elif not loop.first %} {% set_global col = col + 1 %}{% endif %}\
{{ w }}{% set_global col = col + n %}\
{% endfor %}
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Non-conventional subjects (for example "wip: ...") never reach the changelog.
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"

commit_preprocessors = [
  { pattern = '\.$', replace = "" },
  # 0.1.0 starts the cache format at 1, so the pre-release format numbers say nothing.
  { pattern = ' in cache format [0-9]+', replace = "" },
  # The site bar follows the theme in 0.1.0; it was dark only before the release.
  { pattern = '\bslim dark bar\b', replace = "slim bar" },
]

# The order here is the order of the groups in the output (Keep a Changelog order).
commit_parsers = [
  # Superseded before the release, so the notes name only what shipped: the app
  # header was kept dark in light mode, then made to follow the theme.
  { message = "^feat\\(web\\): keep the app header dark in light mode$", skip = true },
  { message = "^feat\\(web\\): the app header stays dark in light mode$", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^(docs|test|chore|ci|build|style|revert)", skip = true },
  { message = "(re-bless|lint)", skip = true },
  { message = ".*", skip = true },
]
