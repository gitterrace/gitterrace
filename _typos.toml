[files]
# vendor and the theme snapshot are copies we do not edit; fonts and build output are not text.
extend-exclude = ["schwarzwald/kit/**", "target/**", "**/vendor/**"]

[default]
extend-ignore-re = [
  # config.rs tests: a deliberately misspelt key or placeholder that validation must refuse
  '"\\"comit\\""',
  '\{titel[:}]',
  # token.rs: RFC 4648 test vector "fo"
  'b"fo"',
  # names-check.py: SHA-256 prefixes are hex, not words
  '"[0-9a-f]{16}"',
]

[default.extend-words]
# A valid spelling, not a typo of another word.
unparseable = "unparseable"
# gix names this field of its worktree status item
rela = "rela"
# the reverse direction of a pair, `confidence_ba`, as `a_changes` is its `a` side
ba = "ba"

