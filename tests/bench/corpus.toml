# Pinned corpus for `make bench`. A local repo has no sha: it is measured at HEAD. Every other
# repo is fetched at exactly this sha, so a re-run measures the same history. Probe fields name
# the files and commit the page timings use.
# A missing probe is discovered from the tree (largest file under the text limit, deepest
# folder, HEAD). A blob or blame probe above that limit is the refusal page, so keep it under.
# why is the reason the repo is in the corpus. docs/benchmarks.md links it to url.
# export_commits bounds `export --commits` (default 500): the report then shows the bound next
# to the time, never a full export. Unset means the default, which every corpus repo uses: an
# export has no page cap, so even linux exports in full. export_samples caps how many timed
# exports a repo runs (default: as many as its cold samples).
# need_gb is the free disk the clone and its blobs need. The harness refuses below it.

[[repo]]
name = "control"
why = "this repository, the floor."
url = "https://github.com/gitterrace/gitterrace.git"
local = "."
class = "small"
need_gb = 1
search = "fn"

[[repo]]
name = "git"
why = "medium, long-lived, a classic reference."
url = "https://github.com/git/git.git"
sha = "50fe5cc63f9cd6e89b87a2c9ccf96a444f4cfdb7"
class = "medium"
need_gb = 3
search = "strbuf"

[[repo]]
name = "rust"
why = "huge history, many files and contributors."
url = "https://github.com/rust-lang/rust.git"
sha = "f90a2d27c2a1e18f10f4fd84c0dcd02710c37de8"
class = "large"
need_gb = 15
# One export: a full rust export takes about 17 minutes. The doc marks it.
export_samples = 1
search = "Option"

[[repo]]
name = "linux"
why = "the extreme, opt-in (`make bench LARGE=1`), about 30 GB."
url = "https://github.com/torvalds/linux.git"
sha = "cbbddb6b08cc9900a87cccaa9b22bbe06aa4f50a"
class = "huge"
need_gb = 30
opt_in = true
# One cold sample: a cold linux index takes too long to repeat. The doc marks it.
cold_samples = 1
export_samples = 1
search = "kmalloc"

# Budgets per size class. First measured run plus headroom (see docs/benchmarks.md), except
# footprint_idle_mb: the serving-memory goal, 32 MB cache budget plus 16 MB margin above a
# just-started server, the same on every class.
[budgets.small]
page_warm_ms = 300
page_cold_ms = 1500
index_secs = 30
idle_cpu_pct = 1
rss_mb = 500
footprint_idle_mb = 48
export_secs = 60

[budgets.medium]
page_warm_ms = 300
page_cold_ms = 3000
index_secs = 300
idle_cpu_pct = 1
rss_mb = 1500
footprint_idle_mb = 48
export_secs = 300

[budgets.large]
page_warm_ms = 300
page_cold_ms = 10000
index_secs = 2400
idle_cpu_pct = 1
rss_mb = 6000
footprint_idle_mb = 48

[budgets.huge]
page_warm_ms = 500
page_cold_ms = 20000
# Product goal: a cold linux index in about 10 minutes.
index_secs = 600
idle_cpu_pct = 1
rss_mb = 8000
footprint_idle_mb = 48
