# The one registry of allowlists and counts that may only fall. vendor/schwarzwald/kit/tools/
# ratchet-check.py compares each entry with the base revision, and land-check fails when one
# grows or a ratchet of the base disappears. A new guard declares its
# allowlist here and needs no change to the check.
#
# [[ratchet]]  file: a JSON file in the repo, path: dotted key of a dict of counts or a list
# [counts]     named integers kept in this file itself
# [retired]    entries = ["<file> <path>"]: a ratchet removed on purpose, its reason beside it

# Fixed sleeps left in the browser checks, per file (scripts/lint/sleeps-check.py), toward none.
[[ratchet]]
file = "scripts/guards/browser-sleeps.json"
path = "browser_sleeps"

[[ratchet]]
file = "schwarzwald/config/wide-allowed.json"
path = "wide_allowed"

[[ratchet]]
file = "scripts/guards/shared-types.json"
path = "allowed_definitions"

[[ratchet]]
file = "scripts/guards/shared-types.json"
path = "openapi.skip_path_prefixes"

# Templates and modules writing an h1 outside the page head (tests/it/conventions.rs), toward
# none: every page opens with pagehead.rs.
[[ratchet]]
file = "schwarzwald/config/own-heads.json"
path = "own_heads"

# `super::` paths outside tests (scripts/lint/super-check.py), toward zero and then a hard rule.
[[ratchet]]
file = "scripts/guards/super-paths.json"
path = "super_paths"

[counts]
# Work clones in .wt/ that are clean and fully landed yet still kept (scripts/dev/sweep-run.sh
# --ratchet, a `make lint` step). Lower it when the pile shrinks, never raise it.
landed_clones = 5
# Markup built with format!/write! in crates/gitterrace-web/src instead of a template.
web_format_html = 3
# The heaviest served page (home, a file, a commit, the log, statistics) of the web test
# page_weight, in raw bytes. Lower it when a cut lands, never raise it.
web_page_bytes = 50657
# The heaviest built page of each kind in raw bytes (xtask site guard 9). Lower it when a cut
# lands, never raise it. The changelog page grows with every release, so it is not measured.
site_bytes_landing = 21224
site_bytes_docs = 50929
site_bytes_other = 17978
# The most files a page of each kind fetches on load: stylesheets, scripts and images not marked
# lazy (xtask site guard 10). Lower it when a cut lands, never raise it.
site_requests_landing = 2
site_requests_docs = 1
site_requests_other = 1
# The same for the served app's main pages (web test page_weight): stylesheets, scripts and
# font preloads.
web_requests = 9

[retired]
# The Rust-only wide-line count moved to the kit's file-length lint, which counts code lines
# in every source glob (CSS, JS and HTML too) from schwarzwald/config/wide-allowed.json.
entries = ["scripts/guards/wide-allowed.json wide_allowed"]
