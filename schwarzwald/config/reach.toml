# Adoption numbers for tools/reach-stats.sh (vendor/schwarzwald/kit). The asset globs match the
# archives only, so the .sha256 files and dist-manifest.json stay out of the count.
repo = "gitterrace/gitterrace"
tap = "gitterrace/homebrew-tap"
ci_baseline = 4

[assets]
"*aarch64-apple-darwin.tar.gz" = "macos/arm64"
"*x86_64-apple-darwin.tar.gz" = "macos/x86_64"
"*aarch64-unknown-linux-gnu.tar.gz" = "linux/arm64"
"*x86_64-unknown-linux-gnu.tar.gz" = "linux/x86_64"
"*windows*.zip" = "windows/x86_64"
