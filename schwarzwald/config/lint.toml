# What the shared lints read for gitterrace (schwarzwald/kit/lint). Data only.
# The keys and their defaults: schwarzwald/kit/lint/config.example.toml.

[product]
name = "gitterrace"

[scope]
prose = ["README.md", "AGENTS.md", "docs/**.md", "tests/bench/**.md"]
code = ["*.rs", "*.py", "*.mjs", "*.js", "*.sh", "*.yml", "*.yaml", "*.toml"]
make = ["Makefile"]
design = ["crates/gitterrace-index/src/seg/store.md"]
golden = ["*/golden/*"]
# Vendored code and the synced copy are not ours to reword.
exclude = ["schwarzwald/kit/*", "target/*", "*/static/vendor/*", ".wt/*"]

[commit]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
allow_prefix = "GITTERRACE_"

[a11y]
docs = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "docs/**.md"]
known = []

[own_shas]
# The one place a tracked file may name a commit of this repository: the build commit a bench
# run recorded in its results JSON, in those results and in the generated results block of
# docs/benchmarks.md. Any other own sha still fails.
allow = ["tests/bench/results/**", "docs/benchmarks.md#results"]
record = "tests/bench/results/*.json"
key = "commit"

[refs]
# The imprint's legal name for a consumer dispute body (VSBG), kept verbatim.
not_id = ['consumer arbitration board']

[root]
# Every tracked top-level entry must be listed, grouped by why it stays at the root. A new file
# goes under scripts/, tests/, docs/ or schwarzwald/config/, or is added here with its reason.
allow = [
  # Project documents
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  # Cargo and toolchain, found by walking up from the workspace root
  ".cargo",
  "Cargo.lock",
  "Cargo.toml",
  "clippy.toml",
  "deny.toml",
  "rust-toolchain.toml",
  # Linter and formatter configs their tools read from the root
  ".gitleaks.toml",
  ".markdownlint-cli2.jsonc",
  ".prettierignore",
  ".prettierrc.json",
  ".vale.ini",
  "_typos.toml",
  "cliff.toml",
  "ruff.toml",
  "sgconfig.yml",
  # Editor and type checker configs, plus the web toolchain manifests
  "jsconfig.json",
  "pyrightconfig.json",
  "package.json",
  "package-lock.json",
  "wrangler.toml",
  # Git and CI
  ".github",
  ".gitignore",
  # The image users build with `docker build .`, and its build context filter
  ".dockerignore",
  "Dockerfile",
  # Make, and the code and content folders
  "Makefile",
  "crates",
  "docs",
  "schwarzwald",
  "scripts",
  "site",
  "tests",
  "xtask",
]

[lines]
max_lines = 600
# Comment lines wrap at rustfmt's max_width, which never wraps a comment.
max_width = 100
# Code lines too: rustfmt leaves strings, macro bodies and comments alone, so a wide one is
# caught here. Allowances in schwarzwald/config/wide-allowed.json only fall.
max_code_width = 100
globs = ["*.rs", "*.py", "*.mjs", "*.js", "*.sh", "*.css", "*.html"]
# Vendored third-party files are not ours to split.
exclude = ["*/static/vendor/*"]

[changelog]
# The git-cliff the output was checked with; keep equal to the version in CONTRIBUTING.
git_cliff = "2.14.2"
file = "CHANGELOG.md"
tag_prefix = "v"

[scripts]
dirs = ["scripts"]
readers = ["Makefile", "*.md", "*.yml", "*.yaml", "*.toml", "scripts/*"]
# Called by name from a tool, not from a text the lint reads. Python imports are followed.
exempt = [
  "scripts/guards/adapters/*.sh",
  "scripts/guards/tests/cases-*.sh",
]

[run]
shell_exclude = ["schwarzwald/kit/**"]
markdownlint = "0.24.0"
steps = [
  "config-drift|bash|install bash|for p in python3 python3.15 python3.14 python3.13 python3.12 python3.11; do command -v $p >/dev/null && $p -c 'import tomllib' 2>/dev/null && exec $p schwarzwald/kit/configs/drift.py --repo .; done; echo no python 3.11; exit 1",
  "schwarzwald-copy|python3|install python 3.11|python3 schwarzwald/kit/check.py",
  "commit-msg-shim|bash|install bash|HOOK=\"$PWD/scripts/hooks/commit-msg\" bash schwarzwald/kit/hooks/commit-msg_test.sh",
  "vale-rs|vale|brew install vale|git ls-files -z -- '*.rs' ':!:vendor/**' | xargs -0 vale --minAlertLevel=error",
  "pyright|npx|install node, then npx fetches pyright|npx --yes pyright@1.1.407",
  "tsc|npm|install node, then npm fetches typescript|t=target/js-types/node_modules; { [ -x $t/.bin/tsc ] && [ -d $t/@types/node ]; } || npm install --silent --no-save --no-package-lock --prefix target/js-types typescript@5.9.3 @types/node@24.10.1 >/dev/null; $t/.bin/tsc -p jsconfig.json",
  "ast-grep|ast-grep|brew install ast-grep|ast-grep scan --error",
  "ast-grep-test|ast-grep|brew install ast-grep|ast-grep test --skip-snapshot-tests",
  "ast-grep-macro|python3|install python3|$PY scripts/ast-grep-macro-check.py",
  "ast-grep-macro-test|python3|install python3|$PY scripts/ast-grep-macro-check.py --self-test",
  "super-ratchet|python3|install python3|python3 scripts/super-check.py",
  "super-ratchet-test|python3|install python3|python3 scripts/super-check.py --self-test",
  "tests-cfg|python3|install python3|python3 scripts/tests-check.py",
  "css-scope|python3|install python3|python3 scripts/css-scope-check.py",
  "site-csp|python3|install python3|python3 scripts/site-check.py csp",
  "machete|cargo-machete|cargo install cargo-machete|cargo-machete",
]
