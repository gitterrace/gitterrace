# Pinned corpus for `make bench`. Each repo is fetched at exactly this sha, so a re-run
# measures the same history. Probe fields name the files and commit the page timings use;
# a missing probe is discovered from the tree (largest text file, deepest folder, HEAD).
# need_gb is the free disk the clone and its blobs need; the harness refuses below it.

[[repo]]
name = "control"
url = "https://github.com/gitterrace/gitterrace.git"
local = "."
sha = "d2ef86fee28d9b406509ac881352cfce09900181"
class = "small"
need_gb = 1
search = "fn"

[[repo]]
name = "git"
url = "https://github.com/git/git.git"
sha = "50fe5cc63f9cd6e89b87a2c9ccf96a444f4cfdb7"
class = "medium"
need_gb = 3
search = "strbuf"

[[repo]]
name = "rust"
url = "https://github.com/rust-lang/rust.git"
sha = "f90a2d27c2a1e18f10f4fd84c0dcd02710c37de8"
class = "large"
need_gb = 15
search = "Option"

[[repo]]
name = "linux"
url = "https://github.com/torvalds/linux.git"
sha = "cbbddb6b08cc9900a87cccaa9b22bbe06aa4f50a"
class = "huge"
need_gb = 30
opt_in = true
search = "kmalloc"

# Budgets per size class. First measured run plus headroom (see docs/benchmarks.md).
[budgets.small]
page_warm_ms = 300
page_cold_ms = 1500
index_secs = 30
idle_cpu_pct = 1
rss_mb = 500
export_secs = 60

[budgets.medium]
page_warm_ms = 300
page_cold_ms = 3000
index_secs = 300
idle_cpu_pct = 1
rss_mb = 1500
export_secs = 300

[budgets.large]
page_warm_ms = 300
page_cold_ms = 10000
index_secs = 2400
idle_cpu_pct = 1
rss_mb = 6000

[budgets.huge]
page_warm_ms = 500
page_cold_ms = 20000
index_secs = 7200
idle_cpu_pct = 1
rss_mb = 8000
