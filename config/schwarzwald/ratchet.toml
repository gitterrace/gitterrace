# The one registry of allowlists and counts that may only fall. shared/schwarzwald/tools/
# ratchet-check.py compares each entry with the base revision, and land-check fails when one
# grows or a ratchet of the base disappears. A new guard declares its
# allowlist here and needs no change to the check.
#
# [[ratchet]]  file: a JSON file in the repo, path: dotted key of a dict of counts or a list
# [counts]     named integers kept in this file itself
# [retired]    entries = ["<file> <path>"]: a ratchet removed on purpose, its reason beside it

[[ratchet]]
file = "config/schwarzwald/wide-allowed.json"
path = "wide_allowed"

[[ratchet]]
file = "scripts/guards/shared-types.json"
path = "allowed_definitions"

[[ratchet]]
file = "scripts/guards/shared-types.json"
path = "openapi.skip_path_prefixes"

# Templates and modules writing an h1 outside the page head (tests/conventions.rs), toward
# none: every page opens with pagehead.rs.
[[ratchet]]
file = "config/schwarzwald/own-heads.json"
path = "own_heads"

# `super::` paths outside tests (scripts/super-check.py), toward zero and then a hard rule.
[[ratchet]]
file = "scripts/guards/super-paths.json"
path = "super_paths"

[counts]
# Markup built with format!/write! in crates/gitterrace-web/src instead of a template.
web_format_html = 17

[retired]
# The Rust-only wide-line count moved to the kit's file-length lint, which counts code lines
# in every source glob (CSS, JS and HTML too) from config/schwarzwald/wide-allowed.json.
entries = ["scripts/guards/wide-allowed.json wide_allowed"]
