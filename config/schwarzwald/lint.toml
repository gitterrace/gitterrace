# What the shared lints read for gitterrace (shared/schwarzwald/lint). Data only.
# The keys and their defaults: shared/schwarzwald/lint/config.example.toml.

[product]
name = "gitterrace"

[scope]
prose = ["README.md", "AGENTS.md", "docs/**.md", "bench/**.md"]
code = ["*.rs", "*.py", "*.mjs", "*.js", "*.sh", "*.yml", "*.yaml", "*.toml"]
make = ["Makefile"]
design = ["crates/gitterrace-index/src/seg/store.md"]
golden = ["*/golden/*"]
# Vendored code and the synced copy are not ours to reword.
exclude = ["shared/*", "target/*", "*/static/vendor/*", ".wt/*"]

[commit]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
allow_prefix = "GITTERRACE_"

[a11y]
docs = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "docs/**.md"]
known = []

[refs]
# The imprint's legal name for a consumer dispute body (VSBG), kept verbatim.
not_id = ['consumer arbitration board']

[lines]
max_lines = 600
# Comment lines wrap at rustfmt's max_width, which never wraps a comment.
max_width = 100
# Code lines too: rustfmt leaves strings, macro bodies and comments alone, so a wide one is
# caught here. Allowances in config/schwarzwald/wide-allowed.json only fall.
max_code_width = 100
globs = ["*.rs", "*.py", "*.mjs", "*.js", "*.sh", "*.css", "*.html"]
# Vendored third-party files are not ours to split.
exclude = ["*/static/vendor/*"]

[changelog]
# The git-cliff the output was checked with; keep equal to the version in CONTRIBUTING.
git_cliff = "2.14.2"
file = "CHANGELOG.md"
tag_prefix = "v"

[scripts]
dirs = ["scripts"]
readers = ["Makefile", "*.md", "*.yml", "*.yaml", "*.toml", "scripts/*"]
# Called by name from a tool, not from a text the lint reads. Python imports are followed.
exempt = [
  "scripts/guards/adapters/*.sh",
  "scripts/guards/tests/cases-*.sh",
]

[run]
shell_exclude = ["shared/**"]
markdownlint = "0.24.0"
steps = [
  "config-drift|bash|install bash|for p in python3 python3.15 python3.14 python3.13 python3.12 python3.11; do command -v $p >/dev/null && $p -c 'import tomllib' 2>/dev/null && exec $p shared/schwarzwald/configs/drift.py --repo .; done; echo no python 3.11; exit 1",
  "schwarzwald-copy|python3|install python 3.11|python3 shared/schwarzwald/check.py",
  "commit-msg-shim|bash|install bash|HOOK=\"$PWD/scripts/hooks/commit-msg\" bash shared/schwarzwald/hooks/commit-msg_test.sh",
  "vale-rs|vale|brew install vale|git ls-files -z -- '*.rs' ':!:vendor/**' | xargs -0 vale --minAlertLevel=error",
  "pyright|npx|install node, then npx fetches pyright|npx --yes pyright@1.1.407",
  "tsc|npm|install node, then npm fetches typescript|t=target/js-types/node_modules; { [ -x $t/.bin/tsc ] && [ -d $t/@types/node ]; } || npm install --silent --no-save --no-package-lock --prefix target/js-types typescript@5.9.3 @types/node@24.10.1 >/dev/null; $t/.bin/tsc -p jsconfig.json",
  "ast-grep|ast-grep|brew install ast-grep|ast-grep scan --error",
  "ast-grep-test|ast-grep|brew install ast-grep|ast-grep test --skip-snapshot-tests",
  "ast-grep-macro|python3|install PyYAML for python3|$PY scripts/ast-grep-macro-check.py",
  "ast-grep-macro-test|python3|install PyYAML for python3|$PY scripts/ast-grep-macro-check.py --self-test",
  "super-ratchet|python3|install python3|python3 scripts/super-check.py",
  "super-ratchet-test|python3|install python3|python3 scripts/super-check.py --self-test",
  "tests-cfg|python3|install python3|python3 scripts/tests-check.py",
  "css-scope|python3|install python3|python3 scripts/css-scope-check.py",
  "site-csp|python3|install python3|python3 scripts/site-check.py csp",
  "machete|cargo-machete|cargo install cargo-machete|cargo-machete",
]
