StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

# Prose rules only. proselint contributes Very and Cliches, by name. Google, Microsoft, alex and
# write-good are not used: they flip our contractions and flag our own words.
[*.md]
BasedOnStyles = Schwarzwald, gitterrace
Schwarzwald.American = NO
proselint.Very = YES
proselint.Cliches = YES

# Published prose spells American English.
[{docs/*.md,README.md,CONTRIBUTING.md,SECURITY.md,CHANGELOG.md}]
Schwarzwald.American = YES

# Comments in Rust: voice and word rules, no spelling swaps (identifiers would trip them).
[*.rs]
BasedOnStyles = Schwarzwald, gitterrace
Schwarzwald.American = NO
