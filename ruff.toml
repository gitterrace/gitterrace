extend = "shared/schwarzwald/configs/ruff-base.toml"
# The synced kit carries its own checks.
extend-exclude = ["shared"]

[lint]
# On top of the base: E7, pyupgrade (UP), simplify (SIM) and ruff's own (RUF). RUF005 only
# prefers [*a, b] over a + [b], churn without a bug behind it.
extend-select = ["E7", "UP", "SIM", "RUF"]
ignore = ["RUF005"]
