{#- A layered "uses" diagram as inline SVG: one row per layer, a box per node, an
arrow per edge from the bottom of the user to the top of the used. The colours are the
site's tokens, set in the stylesheet, so light and dark both follow. -#}
<figure class="diagram"><svg viewBox="0 0 {{ width }} {{ height }}"
width="{{ width }}" height="{{ height }}" role="img" aria-labelledby="{{ id }}-t">
<title id="{{ id }}-t">{{ title }}</title>
<defs><marker id="{{ id }}-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7"
markerHeight="7" orient="auto"><path class="tip" d="M0 0L8 4L0 8z"/></marker></defs>
{%- for e in edges %}
<path d="M{{ e.0 }} {{ e.1 }}C{{ e.0 }} {{ e.4 }} {{ e.2 }} {{ e.4 }} {{ e.2 }} {{ e.3 }}"
marker-end="url(#{{ id }}-a)"/>
{%- endfor %}
{%- for n in nodes %}
<rect x="{{ n.x }}" y="{{ n.y }}" width="{{ n.w }}" height="{{ box_h }}" rx="3"/>
<text x="{{ n.mid }}" y="{{ n.line1 }}" text-anchor="middle"
font-weight="600">{{ n.name }}</text>
<text x="{{ n.mid }}" y="{{ n.line2 }}" text-anchor="middle">{{ n.role }}</text>
{%- endfor %}
</svg></figure>
