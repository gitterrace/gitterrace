{#- The docs index: one section per group, a mono label, then each document as its
title and the one line of what it covers. -#}
<h1>Documentation</h1>
<p class="lead">{{ lead }}</p>
<div class="groups">
{%- for g in groups %}
<section aria-labelledby="{{ g.0.0 }}">
<h2 id="{{ g.0.0 }}">{{ g.0.1 }}</h2>
<ul>
{%- for d in g.1 %}
<li><a href="/{{ d.0 }}">{{ d.1 }}</a><span>{{ d.2 }}</span></li>
{%- endfor %}
</ul>
</section>
{%- endfor %}
</div>
