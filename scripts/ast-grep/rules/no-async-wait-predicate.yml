id: no-async-wait-predicate
language: javascript
severity: error
message: waitForFunction is given an async predicate.
note: A predicate that returns a promise is not a condition the browser can re-check, and webkit was seen to return before it held, so the check read a state it never waited for. Wait with poll(() => page.evaluate(async () => ...)) from scripts/lib/browser-lib.mjs, or with a synchronous predicate over the DOM.
files: [scripts/verify/browser/*.mjs, scripts/lib/*.mjs]
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        has: {field: property, regex: '^waitForFunction$'}
    - has:
        field: arguments
        has:
          nthChild: 1
          any:
            - {kind: arrow_function, regex: '^async'}
            - {kind: function_expression, regex: '^async'}
