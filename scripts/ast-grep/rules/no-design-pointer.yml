# No comment in .rs, .py, .js/.mjs or .sh points at a design doc section. One rule per
# language, since the comment node kinds differ.
id: no-design-pointer-rust
language: rust
severity: error
message: A comment points at a design doc section.
note: 'Sections move and the pointer rots: say the reason in the comment itself.'
ignores: [static/vendor/**, vendor/schwarzwald/kit/**]
rule:
  all:
    - {any: [{kind: line_comment}, {kind: block_comment}]}
    - regex: '§|\b[Ss]ection \d+\.\d+|\bdesign (doc|section)'
