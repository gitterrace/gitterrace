id: no-untyped-json-response
language: rust
severity: error
message: A reply or request body built as untyped JSON.
note: >-
  A body is a struct from gitterrace-types (or a small Serialize struct in the crate when only
  that crate reads both ends), so its fields are named, ordered and described in the OpenAPI
  document. The files in `ignores` below are the bodies not typed yet. Typing one deletes its
  line, and the list must end empty. Never add a line.
files:
  - crates/gitterrace-api/src/**/*.rs
  - crates/gitterrace-web/src/add.rs
  - crates/gitterrace-web/src/live.rs
  - crates/gitterrace-web/src/actions.rs
ignores:
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/tests/**'
  # Not typed yet, one line per file, each with why a user still sees untyped JSON.
  # Insights replies, typed together with their OpenAPI schemas.
  - crates/gitterrace-api/src/insights.rs
rule:
  any:
    - pattern: json!($$$)
    - pattern: serde_json::json!($$$)
    - {kind: scoped_type_identifier, regex: '^serde_json::Value$'}
    - {kind: type_identifier, regex: '^Value$'}
    - {kind: scoped_identifier, regex: '^(serde_json::)?Value::'}
    # Macro bodies are bare tokens, invisible to the patterns above.
    - kind: token_tree
      inside: {stopBy: end, any: [{kind: macro_invocation}, {kind: macro_definition}]}
      regex: '\bjson!|\bValue\b'
  not: {inside: {stopBy: end, kind: mod_item, regex: '^(pub(\(crate\))? )?mod \w*tests'}}
