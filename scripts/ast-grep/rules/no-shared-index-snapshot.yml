id: no-shared-index-snapshot
language: rust
severity: error
message: Loads the worktree index into the repository's shared snapshot.
note: These gix shortcuts keep the whole HEAD index alive for the life of the server, sized by the tree. Build the diff cache with `diff::resource_cache`, which owns its index.
files: [crates/**/*.rs]
ignores: ['**/tests.rs', '**/*_tests.rs', '**/tests/**']
rule:
  any:
    - pattern: $R.diff_resource_cache_for_tree_diff()
    - pattern: $R.diff_resource_cache($$$)
    - pattern: $R.blame_file($$$)
    - pattern: $R.index_or_load_from_head_or_empty()
    - pattern: $R.index_or_load_from_head()
    - pattern: $R.try_index()
    - pattern: $R.index()
    # Macro bodies are bare tokens, invisible to the patterns above.
    - kind: token_tree
      inside: {stopBy: end, any: [{kind: macro_invocation}, {kind: macro_definition}]}
      regex: '\.(diff_resource_cache_for_tree_diff|index_or_load_from_head_or_empty|index_or_load_from_head|try_index|index)\s*\(\s*\)|\.(diff_resource_cache|blame_file)\s*\('
  not: {inside: {stopBy: end, kind: mod_item, regex: '^mod tests'}}
