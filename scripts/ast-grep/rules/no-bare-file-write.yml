id: no-bare-file-write
language: rust
severity: error
message: Writes a file without the no-follow atomic writer.
note: A repository can ship a symlink at any path gitterrace writes, and fs::write / File::create follow it and truncate in place. Use gitterrace_git::write_atomic (temp file with O_NOFOLLOW, then a rename in the same folder).
files: [crates/**/*.rs]
ignores:
  - crates/gitterrace-testkit/**
  - crates/*/tests/**
  - crates/gitterrace-web/src/wiring_tests.rs
  # Test modules kept in their own file (`#[cfg(test)] mod tests;`): the inline-module check
  # below cannot see them. scripts/lint/tests-check.py proves each is compiled for tests only.
  - crates/**/tests.rs
  - crates/**/*_tests.rs
  # Writes to a path the user named or to a per-user folder, not into a repository. Listed so
  # they are moved onto the writer deliberately, not silently allowed.
  - crates/gitterrace/src/main.rs
  - crates/gitterrace/src/handler.rs
rule:
  any:
    - pattern: fs::write($$$)
    - pattern: std::fs::write($$$)
    - pattern: File::create($$$)
    - pattern: fs::File::create($$$)
    - pattern: std::fs::File::create($$$)
    # Macro bodies are bare tokens, invisible to the patterns above.
    - kind: token_tree
      inside: {stopBy: end, any: [{kind: macro_invocation}, {kind: macro_definition}]}
      regex: '\b(fs::write|File::create)\s*\('
  not: {inside: {stopBy: end, kind: mod_item, regex: '^(pub(\(crate\))? )?mod \w*tests'}}
