id: no-super-outside-tests
language: rust
severity: error
message: 'A `use super::` import outside `mod tests`.'
note: 'Name it by a crate:: path (AGENTS.md, imports).'
files: [crates/**/*.rs, xtask/**/*.rs]
# Test modules kept in their own file (`#[cfg(test)] mod tests;`): the inline-module check
# below cannot see them. scripts/tests-check.py proves each is compiled for tests only.
ignores:
  - crates/**/tests.rs
  - crates/**/*_tests.rs
  - xtask/**/tests.rs
  - xtask/**/*_tests.rs
rule:
  any:
    - kind: use_declaration
      regex: '^(pub(\([a-z ]+\))?\s+)?use\s+super::'
    # Macro bodies are bare tokens, invisible to the patterns above.
    - kind: token_tree
      inside: {kind: macro_invocation}
      regex: '\buse\s+super::'
  not: {inside: {stopBy: end, kind: mod_item, regex: '^(pub(\(crate\))? )?mod \w*tests\b'}}
