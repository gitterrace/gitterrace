id: cache-bound-from-budget
language: rust
severity: error
message: A serving cache with a fixed byte bound of its own, outside `resources.cache_mb`.
note: >-
  Every cache a server keeps between requests takes its bound from `Config::cache_bytes(Cache::...)`, whose shares sum to the one budget (gitterrace-config budget.rs). Add a `Cache` variant and give it parts of the budget instead. The git crate is exempt, its object and pack caches live for one thread's job, and the server sets its blame cache from the budget.
files: [crates/**/*.rs]
ignores: [crates/gitterrace-git/**, '**/tests.rs', '**/*_tests.rs', '**/tests/**']
rule:
  any:
    - kind: const_item
      all:
        - has: {field: name, regex: '(CACHE|MEMO)'}
        - has: {field: type, regex: '^(usize|u64)$'}
    # Macro bodies are bare tokens, invisible to the patterns above.
    - kind: token_tree
      inside: {kind: macro_invocation}
      regex: '\bconst\s+\w*(CACHE|MEMO)\w*\s*:\s*(usize|u64)\s*='
  not: {inside: {stopBy: end, kind: mod_item, regex: '^mod tests'}}
