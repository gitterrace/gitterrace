id: no-style-attribute-write
language: javascript
severity: error
message: setAttribute('style', ...) writes an inline style the strict style-src drops.
note: The page policy refuses a style attribute, so the element stays unstyled and a check that plants it goes blind without failing. Set el.style.cssText or el.style.prop, which the CSSOM allows.
files: [scripts/verify/browser/*.mjs, scripts/lib/*.mjs, crates/gitterrace-web/static/*.js]
ignores: [crates/gitterrace-web/static/vendor/**]
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        has: {field: property, regex: '^setAttribute$'}
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: string
          regex: '^.style.$'
