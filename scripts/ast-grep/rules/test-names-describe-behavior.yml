id: test-names-describe-behavior
language: rust
severity: error
message: A test named after a planning label.
note: 'Name the test by the behavior it pins (owner_ties_follow_names), never by a label such as g19_ or p4_ (AGENTS.md, CONV-NO-INTERNAL-REFS).'
files: [crates/**/*.rs, xtask/**/*.rs]
rule:
  kind: function_item
  has: {field: name, regex: '^[gpcGPC][0-9]+[a-z]?_'}
  any:
    - follows: {stopBy: {not: {kind: attribute_item}}, kind: attribute_item, regex: 'test'}
    - inside: {stopBy: end, kind: macro_invocation, regex: '^proptest!'}
