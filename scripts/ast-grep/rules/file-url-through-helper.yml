id: file-url-through-helper
language: rust
severity: error
message: A file URL built by hand from a path.
note: On Windows a path is `C:\x`, and escaping it after `file://` makes a host and no file. Build the URL with `file_url` in crates/gitterrace/src/open/launch.rs, which writes the drive, the slashes and the escapes for each OS.
files: [crates/**/*.rs]
ignores: [crates/gitterrace/src/open/launch.rs, crates/gitterrace-testkit/**, '**/tests.rs', '**/*_tests.rs', '**/tests/**']
rule:
  kind: token_tree
  inside: {stopBy: end, any: [{kind: macro_invocation}, {kind: macro_definition}]}
  regex: '"file://\{'
  not: {inside: {stopBy: end, kind: mod_item, regex: '^mod tests'}}
