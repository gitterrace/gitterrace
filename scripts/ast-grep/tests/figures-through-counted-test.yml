id: figures-through-counted
valid:
  - 'fn page(c: &Counted) -> usize { c.totals().commits }'
  - 'fn spark_times(src: &dyn InsightsSource, from: i64) -> bool { src.commits_in(CommitRange::Time(i64::MIN..from)).next().is_some() }'
  - 'mod tests { fn t(s: &Src) { s.commits_in(CommitRange::All).count(); } }'
invalid:
  - 'fn merges(src: &dyn InsightsSource) -> usize { src.commits_in(CommitRange::All).filter(|c| c.merge).count() }'
  - 'fn wrapped_stats(src: &dyn InsightsSource, rs: &[CommitRow]) { for (_, f) in src.rows_for(rs.iter().map(|c| c.rank).collect()) {} }'
