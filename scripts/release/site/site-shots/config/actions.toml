# The actions file `make site-shots` serves with (git-terrace --config scripts/release/site/site-shots/config).
# The site shows kinds of Send to targets, not one app, so no tendir here. The repo and project
# names are placeholders: the shot opens the Send window and never sends.

version = 1

# A coding agent beside the targets. The shot opens the menu and never runs it, so the
# command is a stand-in that exists on every machine.
[[action]]
id      = "claude"
label   = "Ask Claude Code"
kinds   = ["line", "file", "hunk", "commit", "blame", "search-hit", "insight"]
command = ["/usr/bin/true"]
stdin   = "markdown"
cwd     = "repo"

[[send]]
id    = "mail"
label = "Mail draft"
url   = "mailto:?subject={title}&body={notes}"

[[send]]
id      = "github-issue"
label   = "New issue"
url     = "https://github.com/{var.repo}/issues/new?title={title}&body={notes}"
vars    = { repo = "owner/name" }

[[send]]
id      = "gitlab-merge-request"
label   = "New merge request"
url     = "https://gitlab.com/{var.project}/-/merge_requests/new?merge_request%5Bsource_branch%5D={var.branch}&merge_request%5Btitle%5D={title}&merge_request%5Bdescription%5D={notes}"
vars    = { project = "group/name", branch = "my-branch" }
