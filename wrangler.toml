# Cloudflare config for gitterrace.dev (and gitterrace.com, which redirects to it).
#
# A Worker with static assets, not a Pages project: deploy with `wrangler deploy`.
# `wrangler pages deploy` cannot see a Worker and fails with "Project not found"
# [8000007], which reads as a missing project and invites a duplicate.
#
# No `main`: there is no Worker script, so Cloudflare serves the assets directly and
# never boots an isolate. `_headers` and `404.html` are honoured by the assets runtime.
# The site is build output, never tracked: `cargo xtask generate` writes it to target/site.
# `make deploy` refuses a dirty tree, so the build it ships is the one HEAD makes, and runs the
# site guards on that build first.
name = "gitterrace-web"
compatibility_date = "2026-10-01"
# The account's workers.dev subdomain is timorunge.workers.dev, so a default URL would read
# <name>.timorunge.workers.dev. Serve only on our own domain; the redirect hosts are rules.
workers_dev = false
preview_urls = false
routes = [{ pattern = "gitterrace.dev", custom_domain = true }]

[assets]
directory = "./target/site"
# The 404 page, not an SPA rewrite: a 200 with the homepage for every unknown URL
# hides dead links and confuses crawlers.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
