# Cloudflare config for demo.gitterrace.dev, the live demo: jq and ripgrep as a static export.
#
# A Worker with static assets like the website (see the root wrangler.toml): deploy with
# `wrangler deploy --config deploy/demo/wrangler.toml`, never `wrangler pages deploy`.
#
# No `main`: the assets runtime serves the export directly and applies its `_headers` file, which
# carries the content security policy `git terrace export` writes for its pages.
# The demo is build output, never tracked: `make demo` writes it to target/demo. `make demo-deploy`
# refuses a dirty tree, so the build it ships is the one HEAD makes, and runs the export checks on
# that build first. Paths here resolve from this folder.
name = "gitterrace-demo"
compatibility_date = "2026-10-01"
# Serve only on our own domain, never on <name>.<account>.workers.dev.
workers_dev = false
preview_urls = false
routes = [{ pattern = "demo.gitterrace.dev", custom_domain = true }]

[assets]
directory = "../../target/demo"
html_handling = "auto-trailing-slash"
