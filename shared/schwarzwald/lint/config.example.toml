# config/schwarzwald/lint.toml in a product: what the shared lints read. Data only. Every key
# is optional; the value shown is the default. A key no lint reads is an error.

[product]
# Filled into `{product}` in rules/deny.toml, e.g. "<product> 1a2b3c" as a tracker id.
name = "product"

[scope]
# Globs over repository paths. `**` and `*` both cross folders.
prose = ["README.md", "AGENTS.md", "docs/**.md", "bench/**.md"]
code = ["*.rs", "*.py", "*.mjs", "*.js", "*.sh", "*.yml", "*.yaml", "*.toml"]
make = ["Makefile"]
design = ["docs/design/**.md"]
golden = ["*/golden/*"]
# The synced copy carries its own checks: keep shared/ out.
exclude = ["shared/*", "target/*"]
# Fewer files than this in a tree scan means the census is broken.
min_files = 1

[a11y]
# docs-a11y: the markdown it reads (heading order, one h1, alt text, link text, fence languages).
docs = ["README.md", "docs/**.md"]
# A page with headings but no h1 fails. False allows pages without one.
h1_required = true
# Accepted problems as "path: problem" (the hit without its line number). A stale entry fails.
known = []

[refs]
# Extra patterns the product refuses, and English words its id patterns must skip.
patterns = []
not_id = []

[personal]
# Paths never scanned for personal data (a licence text, a legal page), and extra placeholder
# home names fixtures use.
exempt = []
placeholder_homes = []

[history]
# Shas own-shas and id-scan must keep: upstream corpus pins that collide with own ones.
keep = []
# Regexes for value fields that hold a sha (a tool may write HEAD there), group 1 the
# field, group 2 the sha.
sha_fields = []
# A file OUTSIDE the repository (e.g. under ~/Backups) listing one extra commit source (a git bundle) per line.
# Never a committed path.
bundles = ""
# [pattern, replacement] pairs applied in order to every text file and message by
# product tools (`{ids}` is the real ids of .personal-denylist), and regexes of paths they skip.
replace = []
skip = []
# tools/id-scan.py reads the same skip list.

[lines]
# file-length: files matching globs may not exceed max_lines. max_width caps comment lines
# (0 = off). exclude lists vendored or generated paths on top of [scope] exclude.
max_lines = 600
max_width = 0
# max_code_width caps code lines (0 = off). A file's excess is its allowance in
# config/schwarzwald/wide-allowed.json, {"wide_allowed": {"path": count}}, and may only fall.
max_code_width = 0
globs = ["*.rs", "*.py", "*.mjs", "*.js", "*.sh", "*.css", "*.html"]
exclude = []

[scripts]
# script-orphans: the .sh and .py files under dirs must be named by a file matching readers.
# exempt lists entry points the VCS or a tool calls by name. `manual-only` in a header exempts one.
dirs = ["scripts"]
readers = ["Makefile", "*.md", "*.yml", "*.yaml", "*.toml", "scripts/*"]
exempt = []

[disk]
# tools/disk-floor.py and disk-floor.sh: a build, gate or red run refuses to start below this
# many GiB free. DISK_FLOOR_GIB in the environment wins (0 turns the check off for one run).
floor_gib = 50

[commit]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
# <prefix>ALLOW_FREE_SUBJECT=1 overrides the subject form.
allow_prefix = "SCHWARZWALD_"

[denylist]
# The local .personal-denylist is seeded once and the tracker grows: past max_age_hours (0 = never)
# or when missing, internal-refs prints `refresh` and, in mode "refuse", fails. mode: warn | refuse.
max_age_hours = 168
mode = "warn"
# The product's command that rewrites the list. It must MERGE (tools/denylist-merge.py: the union
# of the current list, the tracker's every code, closed and deleted rows too, and history_ids).
refresh = ""
# A file outside the repository of ids from old history, merged in on every refresh.
history_ids = ""

[changelog]
# tools/changelog-gen.sh and lint/changelog.py: CHANGELOG.md is what git-cliff renders
# from the tagged history. git_cliff pins the version the output was checked with ("" turns
# the check off: a product with no changelog). file and tag_prefix name the file and the tags.
git_cliff = ""
file = "CHANGELOG.md"
tag_prefix = "v"

[run]
# run.sh: the external linters, one PASS or FAIL line each. steps are extra checks, each
# "name|tool|install hint|command" run from the repository root, with $PY set to the python 3.11
# or newer the runner picked. shell_exclude are git
# pathspecs kept out of shellcheck and shfmt. shellcheck_exclude are the codes dropped from
# `shellcheck -o all`. shfmt_indent is the `shfmt -i` width. markdownlint pins the
# markdownlint-cli2 version ("" skips it), markdown_exclude are pathspecs the staged-markdown
# hook leaves out (keep them equal to the product's markdownlint ignores).
steps = []
shell_exclude = []
shellcheck_exclude = ["SC2250", "SC2292", "SC2310", "SC2312"]
shfmt_indent = 2
markdownlint = ""
markdown_exclude = []
