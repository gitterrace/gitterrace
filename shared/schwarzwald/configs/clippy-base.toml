# The part of a clippy config every product shares. clippy reads one file and cannot extend another,
# so each product's clippy.toml carries every entry below and drift.py fails when one is dropped
# or changed. A product adds its own entries beside these.

# Tests may unwrap and dbg!.
allow-unwrap-in-tests = true
allow-dbg-in-tests = true

# A span guard held across an await leaves the span entered on a thread the executor moved on from.
# Use `.instrument(span)` on the future instead.
await-holding-invalid-types = [
    { path = "tracing::span::Entered", reason = "held across an await, this panics the tracing runtime: use `.instrument(span)` on the future instead" },
]
