[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/gitterrace/gitterrace"

[workspace.dependencies]
gitterrace-git = { path = "crates/gitterrace-git", version = "0.1.1" }
gitterrace-index = { path = "crates/gitterrace-index", version = "0.1.1" }
gitterrace-web = { path = "crates/gitterrace-web", version = "0.1.1" }
gitterrace-api = { path = "crates/gitterrace-api", version = "0.1.1" }
gitterrace-config = { path = "crates/gitterrace-config", version = "0.1.1" }
gitterrace-actions = { path = "crates/gitterrace-actions", version = "0.1.1" }
gitterrace-testkit = { path = "crates/gitterrace-testkit" }
gitterrace-types = { path = "crates/gitterrace-types", version = "0.1.1" }
schwarzwald = { path = "vendor/schwarzwald/kit/rust" }
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "blob-diff", "blame", "revision", "index", "mailmap", "status"] }
axum = "0.8"
# The accept loop: an HTTP/1.1 header-read deadline axum::serve does not expose.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service"] }
askama = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
# OS file events (FSEvents, inotify, ReadDirectoryChangesW): its unsafe stays inside it.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "html", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
ammonia = "4"
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
schemars = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["compression-gzip", "compression-br"] }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
# Denied in the manifest so every invocation (build, clippy, editor) agrees.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
redundant_pub_crate = "allow"
future_not_send = "allow"
significant_drop_tightening = "allow"
# Held across an await, a tracing span guard panics the runtime; banned types are in clippy.toml.
await_holding_invalid_type = "deny"
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
ignore_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
# A lint is fixed in code or the site carries #[expect(lint, reason = "...")], never a bare allow.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile cargo-dist builds and publishes. Same as release; named so a
# release build can be tuned without changing what ships.
[profile.dist]
inherits = "release"

# The live demo: `make demo` builds it into target/demo and `make demo-deploy` ships it with
# deploy/demo/wrangler.toml. Read by xtask for the README and site link. `repos` names the tags
# pinned in scripts/lib/corpus-lib.mjs, which the screenshots share; an xtask test holds them in
# step.
[workspace.metadata.demo]
url = "https://demo.gitterrace.dev"
repos = ["jq jq-1.8.2", "ripgrep 15.2.0", "gitterrace v0.1.1"]

# Release automation (cargo-dist): GitHub releases with prebuilt binaries, a
# shell installer and a formula in gitterrace/homebrew-tap, which the release job fills. Run `dist plan` to preview.
[workspace.metadata.dist]
cargo-dist-version = "0.34.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
tap = "gitterrace/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
# Tests and a runtime smoke of every built binary, before host and the tap. See release-check.yml.
allow-dirty = ["ci"]
local-artifacts-jobs = ["./release-check"]
checksum = "sha256"
# Build provenance for every artifact, checked with `gh attestation verify`.
github-attestations = true
# The licence texts of the embedded fonts and script travel in every archive.
extra-files = ["THIRD-PARTY-NOTICES"]
pr-run-mode = "plan"

# dist builds aarch64-apple-darwin on macos-14, which GitHub retired on 2026-11-02: the job
# is cancelled before it starts. macos-15 is the oldest Apple silicon image still served.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
