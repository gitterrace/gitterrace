[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/timorunge/gitterrace"

[workspace.dependencies]
gitterrace-git = { path = "crates/gitterrace-git", version = "0.1.0" }
gitterrace-index = { path = "crates/gitterrace-index", version = "0.1.0" }
gitterrace-web = { path = "crates/gitterrace-web", version = "0.1.0" }
gitterrace-api = { path = "crates/gitterrace-api", version = "0.1.0" }
gitterrace-config = { path = "crates/gitterrace-config", version = "0.1.0" }
gitterrace-actions = { path = "crates/gitterrace-actions", version = "0.1.0" }
gitterrace-cards = { path = "crates/gitterrace-cards", version = "0.1.0" }
schwarzwald = { path = "theme/schwarzwald/rust" }
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "blob-diff", "blame", "revision", "index", "mailmap", "status"] }
axum = "0.8"
askama = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "html", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
ammonia = "4"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "compression-br"] }

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile cargo-dist builds and publishes. Same as release; named so a
# release build can be tuned without changing what ships.
[profile.dist]
inherits = "release"

# Release automation (cargo-dist): GitHub releases with prebuilt binaries, a
# shell installer and a formula in the shared tap. Run `dist plan` to preview.
[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "homebrew"]
tap = "timorunge/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
unix-archive = ".tar.gz"
checksum = "sha256"
pr-run-mode = "plan"
