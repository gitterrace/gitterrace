name: Lint and test

# The jobs behind ci.yml, in two tiers. The fast tier runs on every pull request and push: the
# Linux gate, the browser checks, cargo deny, the MSRV check, and the Docker image when a Docker
# path changed. The full tier (input `full`) adds macOS, Windows and the memory budget; it runs nightly when main
# moved, and by hand. A tag never ships on the fast tier alone: release-check.yml runs macOS,
# Windows and the memory budget again before dist publishes. scripts/lint/gate-check.py holds both
# rules.

on:
  workflow_call:
    inputs:
      full:
        description: Also run the macOS and Windows jobs
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate as `make check`: theme, fmt, clippy -D warnings, tests (the release memory
  # budget among them), docs, lint.
  check-linux:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history and tags: the history lints refuse a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # A pull request is judged by the base branch's lint.toml: its [run] steps run code and its
      # scopes decide what the lints read, so the branch under review may not set them.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git show "origin/${BASE}:schwarzwald/config/lint.toml" >schwarzwald/config/lint.toml
      # The toolchain is pinned once, in rust-toolchain.toml: a floating `stable`
      # turns every new clippy lint into a red build nobody caused.
      # make check cross-checks Windows (clippy-cross); Linux is this runner's host.
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
          cache: cargo
      - uses: ./.github/actions/lint-tools
      # The package lists first: act's runner image ships without them.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # -k: every gate runs after one fails, so one run lists them all; the job still fails.
      # MEMORY=0: the memory budget runs as its own job below, beside this one.
      - run: make -k check CROSS=x86_64-pc-windows-gnu MEMORY=0

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  # A release build is reproducible: repro-check.sh builds the dist profile twice, in two copies
  # of the tree at different paths, and fails naming the file, the offset and any host path that
  # differs. Linux only (ld64 and codesign stamp their own data). schwarzwald/config/repro.toml
  # holds the build, the outputs and the targets.
  repro:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      # The aarch64 build compiles C (zstd-sys) and links with the cross gcc. Without
      # recommends, the target libc headers come only from libc6-dev-arm64-cross.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - run: bash vendor/schwarzwald/kit/tools/repro-check.sh .
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  # rust-version in Cargo.toml is a promise; this proves it. Keep the two in step. Fast tier;
  # release-check.yml runs it again on the release commit.
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96"
      # +1.96 beats rust-toolchain.toml, which pins a newer compiler; the -V line proves it.
      - run: cargo +1.96 -V | grep -q 'cargo 1\.96\.'
      # The promise covers what users build. xtask is a dev tool on the pinned toolchain, and
      # its lint expectations differ between compiler versions.
      - run: cargo +1.96 check --workspace --exclude xtask --all-features --locked

  # The Docker image builds and serves a mounted repository and a folder of two, read-only. The
  # build is a cold release build, so it runs only when a Docker-relevant path changed, on a
  # manual run, and weekly (the pinned base images and the toolchain can drift).
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Docker-relevant paths changed?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
          PATHS: '^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|rust-toolchain\.toml|scripts/verify/docker-check\.sh|crates/|xtask/|docs/actions\.md|\.github/workflows/(ci|lint-and-test)\.yml)'
        run: |
          run=true
          base=${BASE_PR:-$BASE_PUSH}
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            run=false
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              run=true
            elif git diff --name-only "$base" HEAD | grep -qE "$PATHS"; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.run == 'true'
        run: bash scripts/verify/docker-check.sh

  # The real-browser checks (scripts/verify/browser/browser-check.mjs) against a release build, in
  # chromium, webkit and firefox. Nothing else runs them: a red case reached main unseen until this
  # job. Fast tier, so a push cannot go green past a red case. The whole ALL list runs: no
  # --checks filter, and scripts/lint/gate-check.py fails when this job or the Makefile adds one.
  # Expected: about 12 minutes of cold release build, 1 for the site build, 3 for the browsers,
  # 15 to 25 for the checks
  # (an estimate until the first hosted run; ci-budget-check.py holds it to 75% of the limit).
  browser:
    name: Browser checks (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: cargo-browser
      - run: cargo build --release --locked -p gitterrace
      # The site cases serve target/site, which only this step writes (browser-check.mjs NEEDS).
      - run: cargo xtask site
      # The runner image ships node.
      - run: make browser-deps
      # The system libraries webkit and firefox need; act's runner image ships without them.
      - run: sudo env "PATH=$PATH" node node_modules/playwright-core/cli.js install-deps chromium webkit firefox
      - name: Run the browser checks
        run: make -k browser-check BIN=target/release/git-terrace 2>&1 | tee browser-check.log; exit "${PIPESTATUS[0]}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-log
          path: browser-check.log
          if-no-files-found: ignore

  # The release memory budget, beside the gates: alone it takes about 35 minutes on a 4-core
  # runner, which the gate jobs could not also hold. Full tier only (nightly, manual, and the
  # release check runs it again before a tag ships): a push stays on the fast gate.
  memory:
    if: inputs.full
    name: Memory budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: cargo-memory
      - run: make test-memory

  # Full tier from here on. The macOS gate is two parallel jobs, as one job took 34 to 47 minutes
  # against a 60 minute limit: this one runs the make targets built-gates and doc,
  # check-macos-test the tests and lint.
  # scripts/lint/gate-check.py fails when together they stop covering check-built and lint.
  check-macos:
    if: inputs.full
    name: Check (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt
          cache: cargo
      - uses: ./.github/actions/lint-tools
      # The Ubuntu job cross-checks Windows; this runner has neither that target nor Docker.
      # The static steps (theme, names, fmt) read files and do not depend on the OS: the Ubuntu
      # job runs them.
      - run: make -k built-gates doc CROSS=none MEMORY=0

  check-macos-test:
    if: inputs.full
    name: Check tests and lint (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt
          cache: cargo-test
      - uses: ./.github/actions/lint-tools
      # lint runs on macOS too, as its shell and Python tools can differ by OS.
      - run: make -k built-test lint CROSS=none MEMORY=0

  # The Windows binary builds, its tests pass and it serves a repository. The runtime smoke test is
  # the same script the release check and scripts/dev/wine-run.sh use.
  windows:
    if: inputs.full
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: cargo
      - run: cargo build --locked -p gitterrace
      # Every test binary runs even after one fails, so one run lists every Windows failure.
      - run: cargo test --locked --workspace --no-fail-fast
      # The segment store on Windows: the seek_read shim, rename over an open file, retired
      # files that cannot be deleted while a reader holds them. Named, so a red one is visible.
      - name: Segment store guards
        run: cargo test --locked --no-fail-fast -p gitterrace-index --test unreadable --test hostile --test deterministic
      - name: Smoke test
        shell: bash
        run: bash scripts/verify/smoke-check.sh target/debug/git-terrace.exe
