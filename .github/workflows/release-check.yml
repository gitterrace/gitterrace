# The checks a release must pass before dist publishes anything. Called by release.yml (the
# `local-artifacts-jobs` hook in Cargo.toml), which waits for it before host and the tap.
# This is the one hand-written part of the release flow; release.yml itself is generated.
name: Release check

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan, passed through by the generated caller
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate as CI on main, so a tag on a commit that never passed it cannot ship.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # The whole gate, every step after a failure too (make -k). The memory budget is a job of its
    # own below, so this one stays well inside the hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history lints refuse a shallow clone and the changelog check reads the tags.
          fetch-depth: 0
          fetch-tags: true
      # As on CI's Linux job: make check cross-checks Windows (clippy-cross).
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      - uses: ./.github/actions/lint-tools
      # The package lists first: act's runner image ships without them.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # -k: every gate runs after one fails, so one run lists them all; the job still fails.
      - run: make -k check CROSS=x86_64-pc-windows-gnu MEMORY=0

  # The release memory budget, beside the gate: about 35 minutes on a 4-core runner. A job of
  # this workflow, so the release waits for it like every other.
  memory:
    name: Memory budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: make test-memory

  # The advisory and MSRV checks run on the release commit itself: this workflow is a needs of
  # build-global-artifacts, so a red job here stops host, publish and the tap.
  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96"
      - run: cargo +1.96 -V | grep -q 'cargo 1\.96\.'
      - run: cargo +1.96 check --workspace --exclude xtask --all-features --locked

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Every system runs to the end: a red one does not cancel the others, so one release run
      # shows all three. The release still waits for the whole matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      # Every test binary runs even after one fails, so a red release lists all it found.
      - run: cargo test --locked --workspace --no-fail-fast
      # The binary dist ships is built with this profile; the smoke test runs it, so a build
      # that links but cannot serve stops the release.
      - run: cargo build --locked --profile dist -p gitterrace
      - name: Smoke test
        shell: bash
        run: bash scripts/verify/smoke-check.sh "target/dist/git-terrace${{ runner.os == 'Windows' && '.exe' || '' }}"
