name: CI

# Pull requests and pushes to main run the fast tier. A manual run (full by default) and the
# weekly run add macOS and Windows. The jobs live in lint-and-test.yml. Tags are pushed by hand;
# release.yml and release-check.yml gate what they ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the macOS and Windows jobs
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      full: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
