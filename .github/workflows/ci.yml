name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate as `make check`: theme, fmt, clippy -D warnings, tests, docs.
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The toolchain is pinned once, in rust-toolchain.toml: a floating `stable`
      # turns every new clippy lint into a red build nobody caused.
      - id: pin
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-
      # The tools `make lint` runs. cargo-machete is pinned here; the rest come from the runner's
      # package manager, and node ships on both runners for markdownlint-cli2.
      - name: Install lint tools
        shell: bash
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          pip install --user ruff==0.17.3
          if [ "$RUNNER_OS" = macOS ]; then
            brew install typos-cli vale gitleaks shellcheck shfmt
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck shfmt
            cargo install typos-cli --version 1.51.1 --locked
            sudo snap install vale gitleaks --classic || true
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - run: make check

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
