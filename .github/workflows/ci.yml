name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate as `make check`: theme, fmt, clippy -D warnings, tests, docs.
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The toolchain is pinned once, in rust-toolchain.toml: a floating `stable`
      # turns every new clippy lint into a red build nobody caused.
      - id: pin
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-
      # The tools `make lint` runs. cargo-machete is pinned here; the rest come from the runner's
      # package manager, and node ships on both runners for markdownlint-cli2.
      - name: Install lint tools
        shell: bash
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          pip install --user ruff==0.17.3
          if [ "$RUNNER_OS" = macOS ]; then
            brew install typos-cli vale gitleaks shellcheck shfmt actionlint ast-grep
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck shfmt
            cargo install typos-cli --version 1.51.1 --locked
            # Pinned release tarballs: curl -f and tar fail the step, so a missing tool is red.
            bin="$HOME/.local/bin"
            mkdir -p "$bin"
            curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz | tar -xz -C "$bin" vale
            curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$bin" gitleaks
            curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$bin" actionlint
            curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.51.0/app-x86_64-unknown-linux-gnu.zip
            unzip -q -o /tmp/ast-grep.zip ast-grep -d "$bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - run: make check

  # The Windows binary builds, its tests pass and it serves a repository. The runtime smoke test is
  # the same script the release check and scripts/wine-run.sh use.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - id: pin
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-
      - run: cargo build --locked -p gitterrace
      - run: cargo test --locked --workspace
      - name: Smoke test
        shell: bash
        run: bash scripts/smoke-check.sh target/debug/git-terrace.exe

  # rust-version in Cargo.toml is a promise; this proves it. Keep the two in step.
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - run: cargo check --workspace --all-features

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
