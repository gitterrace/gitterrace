# The tools `make lint` runs. cargo-machete is pinned here; the rest come from the runner's
# package manager, and node ships on both runners for markdownlint-cli2.
name: Lint tools
description: Install the tools make lint runs
runs:
  using: composite
  steps:
    - name: Install lint tools
      shell: bash
      run: |
        cargo install cargo-machete --version 0.9.2 --locked
        pip install --user ruff==0.17.3
        if [ "$RUNNER_OS" = macOS ]; then
          brew install typos-cli vale gitleaks shellcheck shfmt actionlint ast-grep
        else
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          cargo install typos-cli --version 1.51.1 --locked
          # Pinned release tarballs: curl -f and tar fail the step, so a missing tool is red.
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL https://github.com/vale-cli/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz | tar -xz -C "$bin" vale
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$bin" gitleaks
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$bin" actionlint
          curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.51.0/app-x86_64-unknown-linux-gnu.zip
          unzip -q -o /tmp/ast-grep.zip ast-grep -d "$bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
