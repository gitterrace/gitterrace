# The pinned toolchain (rust-toolchain.toml names it once: a floating `stable` turns every new
# clippy lint into a red build nobody caused), and with `cache` the cargo registry and target.
name: Rust toolchain
description: Install the toolchain rust-toolchain.toml pins, optionally with a cargo cache
inputs:
  components:
    description: Extra toolchain components
    default: ""
  targets:
    description: Extra compile targets
    default: ""
  cache:
    description: Cache key prefix, empty for no cache
    default: ""
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      id: toolchain
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - if: inputs.cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ inputs.cache }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache }}-${{ steps.toolchain.outputs.cachekey }}-
