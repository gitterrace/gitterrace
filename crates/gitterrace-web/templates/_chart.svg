{#- The parts of a full-width chart (960 by 220, plot from x 58 and y 10). `f` is a `Frame`. -#}
{%- macro open(f) -%}
{%- if f.linked -%}<svg class="chart" viewBox="0 0 960 220" role="group" tabindex="0" data-marks aria-label="{{ f.label }}, arrow keys move between marks" preserveAspectRatio="xMidYMid meet">
{%- else -%}<svg class="chart" viewBox="0 0 960 220" role="img" aria-label="{{ f.label }}" preserveAspectRatio="xMidYMid meet">{%- endif -%}
{%- for t in f.ticks -%}<line class="grid" x1="58" x2="960" y1="{{ t.y }}" y2="{{ t.y }}"/><text class="ax" x="50.0" y="{{ t.ty }}" text-anchor="end">{{ t.label }}</text>{%- endfor -%}
{%- endmacro -%}
{%- macro labels(f) -%}
{%- for l in f.labels -%}<text class="ax" x="{{ l.x }}" y="212.0" text-anchor="{{ l.anchor }}">{{ l.text }}</text>{%- endfor -%}
{%- endmacro -%}
