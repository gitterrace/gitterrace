{% extends "base.html" %}
{% block title %}Stashes · {{ c.name }}{% endblock %}
{% block content %}
{% include "reftabs.html" %}
<div class="card"><table class="entries grow">
{% for s in rows %}<tr><td><a href="{{ s.href }}"><code>{{ s.name }}</code></a></td><td class="grow">{{ s.message }}</td><td class="muted r">{{ s.when }}</td></tr>{% endfor %}
{% if rows.is_empty() %}<tr><td class="muted">No stashes.</td></tr>{% endif %}
</table></div>
{% endblock %}
