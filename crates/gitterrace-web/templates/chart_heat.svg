{%- import "_chart.svg" as ch -%}
<figure class="chart-fig"><svg class="chart heat" viewBox="0 0 {{ w }} {{ h }}" role="img" aria-label="{{ fig.name }}" aria-describedby="{{ fig.id }}-sum">
{%- for (x, hour) in hours %}<text class="ax" x="{{ x }}" y="12">{{ hour }}</text>{% endfor -%}
{%- for r in rows -%}
<text class="ax" x="0" y="{{ r.ly }}">{{ r.day }}</text>
{%- for c in r.cells %}<rect class="h{{ c.level }}" x="{{ c.x }}" y="{{ r.y }}" data-tip="{{ c.tip }}"/>{% endfor -%}
{%- endfor -%}
</svg><div class="heat-legend">Less<i></i><i></i><i></i><i></i><i></i>More</div>
{%- call ch::text(fig) %}{% endcall -%}</figure>
