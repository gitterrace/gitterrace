<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="gt-base" content="">
<title>Repositories · gitterrace</title>
<script>(function(){try{var t=localStorage.getItem("gitterrace-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
{% include "_favicon.html" %}
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="wrap"><div class="topbar">
<a class="brand" href="/"><svg class="logo" viewBox="2 2 28 28" aria-hidden="true"><path class="i" d="M10 23.5A1.25 1.25 0 0 1 8.75 22.25L8.75 14A0.75 0.75 0 0 0 8 13.25L3.25 13.25A1.25 1.25 0 0 1 2 12L2 10A1.25 1.25 0 0 1 3.25 8.75L8 8.75A0.75 0.75 0 0 0 8.75 8L8.75 3.25A1.25 1.25 0 0 1 10 2L12 2A1.25 1.25 0 0 1 13.25 3.25L13.25 8A0.75 0.75 0 0 0 14 8.75L18.75 8.75A1.25 1.25 0 0 1 20 10L20 12A1.25 1.25 0 0 1 18.75 13.25L14 13.25A0.75 0.75 0 0 0 13.25 14L13.25 18.25A0.75 0.75 0 0 0 14 19L23.25 19A1.25 1.25 0 0 1 24.5 20.25L24.5 22.25A1.25 1.25 0 0 1 23.25 23.5Z"/><path class="a" d="M8.75 26.25A1.25 1.25 0 0 1 10 25L28.75 25A1.25 1.25 0 0 1 30 26.25L30 28.25A1.25 1.25 0 0 1 28.75 29.5L10 29.5A1.25 1.25 0 0 1 8.75 28.25Z"/></svg><span class="wordmark">gitterrace</span></a>
<span class="sep" aria-hidden="true">/</span>
<span class="reponame">Repositories</span>
</div></div></header>
<main class="wrap" id="main" tabindex="-1">
<div class="card repolist">
{{ head }}
<form class="repofilter" method="get" action="/"
 role="search" data-repofilter>
<label class="vh" for="repoq">Filter repositories by name</label>
<input id="repoq" type="search" name="q" value="{{ q }}"
 placeholder="Filter repositories" autocomplete="off" spellcheck="false">
<button type="submit" class="repofilter-go">Filter</button>
<span class="muted repocount" id="repocount" role="status"
 aria-live="polite">{{ count }}</span></form>
<ul class="repos">
{% for r in rows %}<li class="reporow" data-name="{{ r.name }}"
{%- if r.hidden %} hidden{% endif %}><div class="rtop"><a class="rname" href="{{ r.href }}">{{ r.name }}</a>{% if let Some(d) = r.dirty %}<a class="wtchip" href="{{ r.href }}worktree" data-repo="{{ r.name }}" data-tip="Uncommitted changes in the working tree"{% if !d %} hidden{% endif %}><span class="dot"></span><span class="label">Uncommitted</span></a>{% endif %}<span class="rmeta"><span class="muted">{{ r.when }}</span><span class="sparkcell" data-tip="{{ r.tip }}"><svg class="spark s1" viewBox="0 0 90 20" width="90" height="20" aria-hidden="true"><polyline points="{{ r.spark }}"/></svg><span class="muted">{{ r.total }}</span></span></span></div>
<a class="today" href="{{ r.commit_href }}" data-tip="{{ r.today }}">{{ r.today }}</a></li>
{% endfor %}</ul>
<p class="muted repos-none"{% if !none %} hidden{% endif %}>No repository matches</p></div>
</main>
<script src="/static/outline.js" defer></script>
<script src="/static/home.js" defer></script>
</body>
</html>
