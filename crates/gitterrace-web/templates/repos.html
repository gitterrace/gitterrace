<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="gt-base" content="">
<title>Repositories · gitterrace</title>
<script>(function(){try{var t=localStorage.getItem("gitterrace-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top"><div class="wrap"><div class="topbar">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path class="stem" d="M8.25 4.25v10h5.5v5.5h3M4.25 9.25h11"/><rect class="tread" x="15.25" y="18.25" width="6" height="3" rx="1.5"/></svg><span class="wordmark">gitterrace</span></a>
<span class="sep" aria-hidden="true">/</span>
<span class="reponame">Repositories</span>
</div></div></header>
<main class="wrap">
<div class="card files-card"><table class="entries" data-last>
<tr class="th"><td>Repository</td><td>Last commit</td><td class="r">Updated</td><td class="r">Commits, 26 weeks</td></tr>
{% for r in rows %}<tr><td><a href="{{ r.href }}"><span class="ico dir"></span>{{ r.name }}</a></td><td class="lc muted"><a href="{{ r.commit_href }}">{{ r.subject }}</a></td><td class="muted r">{{ r.when }}</td><td class="sparkcell r" data-tip="{{ r.total }} commits in 26 weeks, busiest week {{ r.peak }}."><svg class="spark s1" viewBox="0 0 90 20" width="90" height="20" aria-hidden="true"><polyline points="{{ r.spark }}"/></svg><span class="muted">{{ r.total }}</span></td></tr>{% endfor %}
</table></div>
</main>
</body>
</html>
