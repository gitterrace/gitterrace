<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="gt-base" content="">
<title>Repositories · gitterrace</title>
<script>(function(){try{var t=localStorage.getItem("gitterrace-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
{% include "_favicon.html" %}
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="wrap"><div class="topbar">
<a class="brand" href="/"><svg class="logo" viewBox="2 2 28 28" aria-hidden="true"><path class="i" d="M9.5 24A1.5 1.5 0 0 1 8 22.5L8 15A1 1 0 0 0 7 14L3.5 14A1.5 1.5 0 0 1 2 12.5L2 9.5A1.5 1.5 0 0 1 3.5 8L7 8A1 1 0 0 0 8 7L8 3.5A1.5 1.5 0 0 1 9.5 2L12.5 2A1.5 1.5 0 0 1 14 3.5L14 7A1 1 0 0 0 15 8L18.5 8A1.5 1.5 0 0 1 20 9.5L20 12.5A1.5 1.5 0 0 1 18.5 14L15 14A1 1 0 0 0 14 15L14 17A1 1 0 0 0 15 18L22.5 18A1.5 1.5 0 0 1 24 19.5L24 23A1 1 0 0 0 25 24ZM13.7 24H24.4V24.25H13.7ZM14 24H28V27H14Z"/><path class="a" d="M28.5 24A1.5 1.5 0 0 1 30 25.5L30 28.5A1.5 1.5 0 0 1 28.5 30L15.5 30A1.5 1.5 0 0 1 14 28.5L14 25A1 1 0 0 0 13 24Z"/></svg><span class="wordmark">gitterrace</span></a>
<span class="sep" aria-hidden="true">/</span>
<span class="reponame">Repositories</span>
</div></div></header>
<main class="wrap" id="main" tabindex="-1">
<div class="card files-card"><table class="entries" data-last>
<tr class="th"><td>Repository</td><td>Last commit</td><td class="r">Updated</td><td class="r">Recent commits</td></tr>
{% for r in rows %}<tr><td><a href="{{ r.href }}"><span class="ico dir"></span>{{ r.name }}</a></td><td class="lc muted"><a class="subj" href="{{ r.commit_href }}">{{ r.subject }}</a></td><td class="muted r">{{ r.when }}</td><td class="sparkcell r" data-tip="{{ r.tip }}"><svg class="spark s1" viewBox="0 0 90 20" width="90" height="20" aria-hidden="true"><polyline points="{{ r.spark }}"/></svg><span class="muted">{{ r.total }}</span></td></tr>{% endfor %}
</table></div>
</main>
</body>
</html>
