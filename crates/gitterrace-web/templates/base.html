<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ c.name }}{% endblock %} · gitterrace</title>
<script>(function(){try{var q=/[?&]theme=(light|dark)/.exec(location.search),t=q?q[1]:localStorage.getItem("gitterrace-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='4' width='18' height='4' rx='2' fill='%230f766e'/%3E%3Crect x='3' y='10' width='18' height='4' rx='2' fill='%23b7791f' opacity='.8'/%3E%3Crect x='3' y='16' width='18' height='4' rx='2' fill='%2364748b' opacity='.7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/markdown.css">
</head>
<body>
<header class="top"><div class="wrap">
<div class="topbar">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect class="l1" x="3" y="3.5" width="18" height="4.5" rx="2.25"/><rect class="l2" x="3" y="9.75" width="18" height="4.5" rx="2.25"/><rect class="l3" x="3" y="16" width="18" height="4.5" rx="2.25"/></svg></a>
<a class="reponame" href="/">{{ c.name }}</a>
<a class="branch" href="/refs" title="Branches and tags"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5a1.5 1.5 0 1 1-2 1.41v6.18a1.5 1.5 0 1 1 1.5 0V8.5H9a1 1 0 0 0 1-1V6.4a1.5 1.5 0 1 1 1.5 0V7.5A2.5 2.5 0 0 1 9 10H4.5v1.09A1.5 1.5 0 1 1 3 11.09V4.91A1.5 1.5 0 0 1 5 3.5z" transform="translate(0 0)"/></svg>{{ c.branch }}</a>
<span class="spacer"></span>
<button class="theme" type="button" id="theme" aria-label="Color theme" title="Color theme">
<svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
<svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
<svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
</div>
<nav class="tabnav">{% for n in c.nav %}<a href="{{ n.href }}"{% if n.on %} class="on" aria-current="page"{% endif %}>{{ n.label }}</a>{% endfor %}</nav>
</div></header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
{% if c.md %}<script src="/static/markdown.js" defer></script>{% endif %}
</body>
</html>
