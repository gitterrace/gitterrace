<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{{ c.name }}{% endblock %} · gitterrace</title>
<script>(function(){try{var q=/[?&]theme=(light|dark)/.exec(location.search),t=q?q[1]:localStorage.getItem("gitterrace-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 role=%22img%22 aria-label=%22gitterrace%22%3E%3Cstyle%3E.i%7Bstroke:%2321272e%7D.a%7Bfill:%235b5e8d%7D%40media %28prefers-color-scheme:dark%29%7B.i%7Bstroke:%23e3ecf6%7D.a%7Bfill:%239ca1d4%7D%7D%3C/style%3E%3Cpath class=%22i%22 fill=%22none%22 stroke-width=%223%22 stroke-linejoin=%22round%22 stroke-linecap=%22square%22 d=%22M7.5 4.5V15h6v4.5h1.5M4.5 9h10.5%22/%3E%3Crect class=%22a%22 x=%2215%22 y=%2218%22 width=%226%22 height=%223%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/markdown.css">
</head>
<body data-rev="{{ c.rev }}" data-commit="{{ c.commit }}">
<header class="top"><div class="wrap">
<div class="topbar">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path class="stem" d="M8.25 4.25v10h5.5v5.5h3M4.25 9.25h11"/><rect class="tread" x="15.25" y="18.25" width="6" height="3" rx="1.5"/></svg><span class="wordmark">gitterrace</span></a>
<span class="sep" aria-hidden="true">/</span>
<a class="reponame" href="/">{{ c.name }}</a>
<div class="refswitch"><button class="branch" type="button" id="refbtn" aria-haspopup="true" aria-expanded="false" title="Switch branch or tag"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5a1.5 1.5 0 1 1-2 1.41v6.18a1.5 1.5 0 1 1 1.5 0V8.5H9a1 1 0 0 0 1-1V6.4a1.5 1.5 0 1 1 1.5 0V7.5A2.5 2.5 0 0 1 9 10H4.5v1.09A1.5 1.5 0 1 1 3 11.09V4.91A1.5 1.5 0 0 1 5 3.5z"/></svg>{% if c.rev == "HEAD" %}{{ c.branch }}{% else %}{{ c.rev }}{% endif %}<span class="caret" aria-hidden="true"></span></button></div>
{% if c.dirty %}<a class="wtchip" href="/worktree" title="Uncommitted changes in the working tree"><span class="dot"></span>Working tree</a>{% endif %}
<span class="spacer"></span>
<form class="topsearch" action="/search" method="get" role="search"><input id="q" name="q" type="search" placeholder="Search code and commits" aria-label="Search" autocomplete="off"><input type="hidden" name="rev" value="{{ c.rev }}"><kbd>/</kbd></form>
<button class="theme" type="button" id="theme" aria-label="Color theme" title="Color theme">
<svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
<svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
<svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
</div>
<nav class="tabnav">{% for n in c.nav %}<a href="{{ n.href }}"{% if n.on %} class="on" aria-current="page"{% endif %}>{{ n.label }}</a>{% endfor %}</nav>
</div></header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
<script src="/static/nav.js" defer></script>
{% if c.md %}<script src="/static/markdown.js" defer></script>{% endif %}
</body>
</html>
