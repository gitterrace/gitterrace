{#- One row's cell of the Graph view: lines stretched to the row, the commit's dot, and the
"+N" folds for a narrow and a wide screen. Decorative: the row's text carries the meaning. -#}
<span class="graph" aria-hidden="true"><svg class="gl" width="{{ w }}" viewBox="0 0 {{ w }} 100" preserveAspectRatio="none">{% for p in paths %}<path{% if !p.cls.is_empty() %} class="{{ p.cls }}"{% endif %} d="{{ p.d }}"/>{% endfor %}{% if let Some(x) = stub %}<path class="stub{% if !off.is_empty() %} {{ off }}{% endif %}" d="M{{ x }} 50V80"/>{% endif %}</svg><svg class="gd" width="{{ w }}" height="10" viewBox="0 -5 {{ w }} 10"><circle class="{{ dot }}{% if !off.is_empty() %} {{ off }}{% endif %}" cx="{{ cx }}" cy="0" r="3.5"/></svg>{% for s in edge %}<span class="gedge {{ s }}"></span>{% endfor %}{% for (cls, n) in folds %}<span class="gfold {{ cls }}">+{{ n }}</span>{% endfor %}</span>
