<div class="segctl" role="group" aria-label="{{ self.name }}" data-seg-select>{% if !self.caption.is_empty() %}<span class="segcap">{{ self.caption }}</span>{% endif %}<span class="segs">{% for c in self.choices %}{% if !self.panes.is_empty() %}<label data-show="{{ c.target }}"><input type="radio" name="{{ self.panes }}" value="{{ c.target }}"{% if c.on %} checked{% endif %}>{{ c.label }}</label>{% else if self.buttons %}<button type="button" data-show="{{ c.target }}"{% if c.on %} class="on" aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>{{ c.label }}</button>{% else %}<a href="{{ c.target }}"{% if c.on %} class="on" aria-current="true"{% endif %}>{{ c.label }}</a>{% endif %}{% endfor %}</span><select class="segsel" aria-label="{{ self.name }}" hidden>{% for c in self.choices %}<option value="{{ c.target }}"{% if c.on %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></div>
