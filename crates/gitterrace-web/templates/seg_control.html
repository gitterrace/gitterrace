<div class="segctl" role="group" aria-label="{{ s.name }}" data-seg-select>{% if !s.caption.is_empty() %}<span class="segcap">{{ s.caption }}</span>{% endif %}<span class="segs">{% for c in s.choices %}{% if !s.panes.is_empty() %}<label data-show="{{ c.target }}"><input type="radio" name="{{ s.panes }}" value="{{ c.target }}"{% if c.on %} checked{% endif %}>{{ c.label }}</label>{% else if s.buttons %}<button type="button" data-show="{{ c.target }}"{% if c.on %} class="on" aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>{{ c.label }}</button>{% else %}<a href="{{ c.target }}"{% if c.on %} class="on" aria-current="true"{% endif %}>{{ c.label }}</a>{% endif %}{% endfor %}</span><select class="segsel" aria-label="{{ s.name }}" hidden>{% for c in s.choices %}<option value="{{ c.target }}"{% if c.on %} selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></div>
