[package]
name = "gitterrace-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "axum server, askama templates, static assets and the request guard."

[lints]
workspace = true

[dependencies]
gitterrace-types.workspace = true
gitterrace-git.workspace = true
gitterrace-actions.workspace = true
gitterrace-config.workspace = true
gitterrace-index.workspace = true
gitterrace-api.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
askama.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
two-face.workspace = true
ammonia.workspace = true
serde_json.workspace = true
regex = "1"
csv = "1"
zip = { version = "9", default-features = false }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tower.workspace = true
tower-http.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
gitterrace-index = { workspace = true, features = ["oracle"] }
gitterrace-testkit.workspace = true
tempfile.workspace = true
http-body-util = "0.1"

# The memory budget runs where the binary uses jemalloc: not on Windows (see the binary's
# Cargo.toml), where jemalloc does not build.
[target.'cfg(not(windows))'.dev-dependencies]
tikv-jemallocator = "0.7"
# `stats`: the memory budget reads live heap (`stats.allocated`), which load cannot move.
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
