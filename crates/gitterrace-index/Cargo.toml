[package]
name = "gitterrace-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Insights cache in .git/gitterrace/, append-only and rebuildable, and the aggregates over it."

[features]
# The in-memory oracle (MemorySource, Index::records, Insights::new) for equivalence tests.
# Enabled from dev-dependencies only, so no shipped build can serve from it.
oracle = []

[lints]
workspace = true

[dependencies]
gitterrace-types.workspace = true
gitterrace-config.workspace = true
gitterrace-git.workspace = true
serde.workspace = true
serde_json.workspace = true
crc32fast = "1.5"
thiserror.workspace = true
zstd = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
gitterrace-index = { workspace = true, features = ["oracle"] }
gitterrace-testkit.workspace = true
tempfile.workspace = true
cap = "0.1"
proptest = { version = "1.12", default-features = false, features = ["std"] }
