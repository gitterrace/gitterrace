[package]
name = "gitterrace-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "User actions: actions.toml, the payload v1 contract and the sandboxed runner."

[lints]
workspace = true

[dependencies]
gitterrace-types.workspace = true
gitterrace-git.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
getrandom = "0.4"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
gitterrace-config.workspace = true
gitterrace-testkit.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }
