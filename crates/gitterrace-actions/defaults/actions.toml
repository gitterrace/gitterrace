# gitterrace actions.toml, pre-filled. `git terrace init` writes this file to your
# config folder. Edit it freely. It is a normal actions file, loaded by the same rules as
# any other. An entry with `enabled = false` is checked at load but not offered, so switch on
# only what you use: set `enabled = true` and fill in its `vars`.
#
# A send may also have a `lookup` template: the commit page then links to it as "Find this
# commit in ...", and the destination does the search. It takes {sha} and {short}.
#
# Each block is described by the comment lines right above it.

version = 1

# ---- Send to: URL templates the browser opens, and you confirm on the destination's own page.

# Opens tendir's new-task sheet, filled in. Needs the tendir app.
[[send]]
id      = "tendir"
label   = "Send to tendir"
enabled = false
url     = "tendir://new-task?title={title}&notes={notes}"

# A mail draft in your mail app.
[[send]]
id    = "mail"
label = "Mail draft"
url   = "mailto:?subject={title}&body={notes}"

# A new issue on github.com. `repo` is `owner/name`.
[[send]]
id      = "github-issue"
label   = "New issue"
enabled = false
url     = "https://github.com/{var.repo}/issues/new?title={title}&body={notes}"
lookup  = "https://github.com/{var.repo}/search?q={sha}&type=commits"
vars    = { repo = "owner/name" }

# A new discussion on github.com. `repo` is `owner/name`, `category` the category slug.
[[send]]
id      = "github-discussion"
label   = "New discussion"
enabled = false
url     = "https://github.com/{var.repo}/discussions/new?category={var.category}&title={title}&body={notes}"
vars    = { repo = "owner/name", category = "general" }

# A new issue on gitlab.com. `project` is `group/name`, or `group/subgroup/name`.
[[send]]
id      = "gitlab-issue"
label   = "New issue"
enabled = false
url     = "https://gitlab.com/{var.project}/-/issues/new?issue%5Btitle%5D={title}&issue%5Bdescription%5D={notes}"
lookup  = "https://gitlab.com/{var.project}/-/search?search={sha}&scope=commits"
vars    = { project = "group/name" }

# A new issue on a self-hosted instance of that host. `base` is the instance URL, `project` is
# `group/name`.
[[send]]
id      = "gitlab-issue-self-hosted"
label   = "New issue"
enabled = false
url     = "{var.base}/{var.project}/-/issues/new?issue%5Btitle%5D={title}&issue%5Bdescription%5D={notes}"
lookup  = "{var.base}/{var.project}/-/search?search={sha}&scope=commits"
vars    = { base = "https://gitlab.example.test", project = "group/name" }

# A new merge request on gitlab.com from a fixed branch. `branch` is the source branch. The
# Send window has no branch field, so change `branch` in this file before you send.
[[send]]
id      = "gitlab-merge-request"
label   = "New merge request"
enabled = false
url     = "https://gitlab.com/{var.project}/-/merge_requests/new?merge_request%5Bsource_branch%5D={var.branch}&merge_request%5Btitle%5D={title}&merge_request%5Bdescription%5D={notes}"
vars    = { project = "group/name", branch = "my-branch" }

# A new issue on a self-hosted forge. `base` is the instance URL, `repo` is `owner/name`.
[[send]]
id      = "forgejo-issue"
label   = "New issue"
enabled = false
url     = "{var.base}/{var.repo}/issues/new?title={title}&body={notes}"
lookup  = "{var.base}/{var.repo}/issues?q={sha}&type=all"
vars    = { base = "https://codeberg.org", repo = "owner/name" }

# ---- Actions: programs of yours, run with no shell. See the scripts in docs/actions.

# Copies the selection as markdown on any system. Needs `clipboard.sh` from docs/actions in your
# config folder.
[[action]]
id      = "copy"
label   = "Copy to clipboard"
enabled = false
kinds   = ["line", "file", "commit"]
command = ["~/.config/gitterrace/clipboard.sh"]
stdin   = "markdown"

# Opens the file at the selected line in your editor. Needs `editor.sh` from docs/actions.
[[action]]
id      = "edit"
label   = "Open in editor"
enabled = false
kinds   = ["line"]
command = ["~/.config/gitterrace/editor.sh", "{line_start}", "{root}/{path}"]
stdin   = "none"

# Adds a task with the tendir command line tool.
[[action]]
id      = "tendir-add"
label   = "Add to tendir"
enabled = false
kinds   = ["line", "hunk", "commit", "blame", "page"]
command = ["tendir", "add", "--notes", "{markdown}", "--", "{title}"]
key     = "n"

# Hands the selection to Claude Code in a new terminal, in the repository. Needs `agent.sh`
# from docs/actions and `claude` on PATH.
[[action]]
id      = "claude"
label   = "Ask Claude Code"
enabled = false
kinds   = ["line", "file", "hunk", "commit", "blame", "search-hit", "insight"]
command = ["~/.config/gitterrace/agent.sh", "claude"]
stdin   = "markdown"
cwd     = "repo"

# Hands the selection to Codex CLI in a new terminal, in the repository. Needs `agent.sh` from
# docs/actions and `codex` on PATH.
[[action]]
id      = "codex"
label   = "Ask Codex"
enabled = false
kinds   = ["line", "file", "hunk", "commit", "blame", "search-hit", "insight"]
command = ["~/.config/gitterrace/agent.sh", "codex"]
stdin   = "markdown"
cwd     = "repo"

# Hands the selection to Kiro CLI in a new terminal, in the repository. Needs `agent.sh` from
# docs/actions and `kiro-cli` on PATH.
[[action]]
id      = "kiro"
label   = "Ask Kiro"
enabled = false
kinds   = ["line", "file", "hunk", "commit", "blame", "search-hit", "insight"]
command = ["~/.config/gitterrace/agent.sh", "kiro"]
stdin   = "markdown"
cwd     = "repo"

# Hands the selection to Gemini CLI in a new terminal, in the repository. Needs `agent.sh`
# from docs/actions and `gemini` on PATH. Any other agent works the same way: pass its
# command to `agent.sh` instead.
[[action]]
id      = "gemini"
label   = "Ask Gemini"
enabled = false
kinds   = ["line", "file", "hunk", "commit", "blame", "search-hit", "insight"]
command = ["~/.config/gitterrace/agent.sh", "gemini"]
stdin   = "markdown"
cwd     = "repo"

# Posts the payload as JSON to a webhook of yours. Set `url` in `vars`.
[[action]]
id      = "webhook"
label   = "Post to webhook"
enabled = false
kinds   = ["line", "commit"]
command = [
  "curl", "-fsS", "-m", "8",
  "-H", "Content-Type: application/json",
  "--data-binary", "@-",
  "{var.url}",
]
stdin   = "json"
vars    = { url = "https://example.test/hook" }
