[package]
name = "gitterrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A local, read-only git browser: code, history and insights, offline, in one binary."
homepage = "https://gitterrace.dev"
keywords = ["git", "browser", "insights", "repository", "offline"]
categories = ["command-line-utilities", "development-tools"]
# Ships as release binaries, the Homebrew tap and `cargo install --git`, not crates.io:
# the binary needs eight workspace crates that are not published either.
publish = false

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
gitterrace-git.workspace = true
gitterrace-index.workspace = true
gitterrace-api.workspace = true
gitterrace-config.workspace = true
gitterrace-cards.workspace = true
gitterrace-web.workspace = true
gitterrace-actions.workspace = true
axum.workspace = true
tower.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The system allocator on macOS keeps freed pages: a server that drops an idle 800 MB record set
# stayed at that footprint. jemalloc with decay 0, set at start (`src/alloc.rs`), hands them back.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = "0.7"

# One binary: you run `git terrace`, because git runs any `git-<name>` on PATH.
[[bin]]
name = "git-terrace"
path = "src/main.rs"

[dev-dependencies]
gitterrace-testkit.workspace = true
tempfile.workspace = true
