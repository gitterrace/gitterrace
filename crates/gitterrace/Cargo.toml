[package]
name = "gitterrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browse any git repository in your browser: code, history and insights, offline, in one binary"
homepage = "https://github.com/timorunge/gitterrace"
keywords = ["git", "browser", "insights", "repository", "offline"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
gitterrace-git.workspace = true
gitterrace-index.workspace = true
gitterrace-api.workspace = true
gitterrace-config.workspace = true
gitterrace-cards.workspace = true
gitterrace-web.workspace = true
axum.workspace = true
tower.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `git terrace` works because git runs any `git-<name>` on PATH. `gitterrace` is
# the same program under its own name. Both share main.rs on purpose; cargo's
# "present in multiple build targets" note about it is expected.
[[bin]]
name = "git-terrace"
path = "src/main.rs"

[[bin]]
name = "gitterrace"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
