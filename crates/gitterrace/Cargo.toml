[package]
name = "gitterrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A GitHub/GitLab-style view of any git repository, offline, in one binary"
homepage = "https://github.com/timorunge/gitterrace"
keywords = ["git", "github", "insights", "repository", "offline"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
gitterrace-git.workspace = true
gitterrace-index.workspace = true
gitterrace-api.workspace = true
gitterrace-cards.workspace = true
gitterrace-web.workspace = true
axum.workspace = true
tower.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `git terrace` works because git runs any `git-<name>` on PATH. `gitterrace` is
# the same binary under a shorter name.
[[bin]]
name = "git-terrace"
path = "src/main.rs"

[[bin]]
name = "gitterrace"
path = "src/main.rs"

[features]
default = []
# Rasterize cards to PNG (`git terrace wrapped --png`). Off by default: it adds
# a text renderer to the binary.
png = ["gitterrace-cards/png"]
