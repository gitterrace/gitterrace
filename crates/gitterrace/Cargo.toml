[package]
name = "gitterrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A local, read-only git browser: code, history and insights, offline, in one binary."
homepage = "https://gitterrace.dev"
keywords = ["git", "browser", "insights", "repository", "offline"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dependencies]
gitterrace-git.workspace = true
gitterrace-index.workspace = true
gitterrace-api.workspace = true
gitterrace-config.workspace = true
gitterrace-cards.workspace = true
gitterrace-web.workspace = true
gitterrace-actions.workspace = true
axum.workspace = true
tower.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
libc.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# One binary: you run `git terrace`, because git runs any `git-<name>` on PATH.
[[bin]]
name = "git-terrace"
path = "src/main.rs"

[dev-dependencies]
gitterrace-testkit.workspace = true
tempfile.workspace = true
