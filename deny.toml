[advisories]
# A crate yanked after we locked it was withdrawn or compromised.
yanked = "deny"
# An ignore whose advisory no longer matches is dead weight and fails.
unused-ignored-advisory = "deny"
# Each ignore names the crate, the path that pulls it in, and why it stays.
# Revisit when the upstream that pulls it in moves.
ignore = [
    # basic-toml (unmaintained): askama's derive macro reads askama.toml with
    # it at compile time only; no runtime input reaches it.
    "RUSTSEC-2026-0374",
    # bincode (unmaintained): syntect loads its bundled, compiled-in syntax
    # dump with it; no untrusted input is ever decoded.
    "RUSTSEC-2025-0141",
    # paste (unmaintained): tikv-jemalloc-ctl 0.7.0 uses it as a proc macro at compile time
    # only; no runtime code. The ctl crate is the only safe way to set the page decay at start
    # (the workspace forbids unsafe), and 0.7.0 is its latest release. Upstream main already
    # dropped paste, so drop this ignore with the first release after 0.7.0.
    # Expires 2027-02-05: if that date passes with no such release, decide again.
    "RUSTSEC-2024-0436",
    # chrono (unmaintained, no vulnerability): rmcp depends on it unconditionally for the MCP
    # protocol's timestamp fields, and schemars through rmcp's chrono04 feature. No feature
    # drops it. Drop this ignore when rmcp moves to jiff or time.
    # Expires 2027-05-18: if that date passes with rmcp still on chrono, decide again.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # zstd-sys labels its legacy-format decoders (zstd/lib/legacy) with the 2-clause form.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates depend on each other by path; they never publish.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
