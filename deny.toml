[graph]
all-features = true

[advisories]
# Each ignore names the crate, the path that pulls it in, and why it stays.
# Revisit when the upstream that pulls it in moves.
ignore = [
    # basic-toml (unmaintained): askama's derive macro reads askama.toml with
    # it at compile time only; no runtime input reaches it.
    "RUSTSEC-2026-0374",
    # bincode (unmaintained): syntect loads its bundled, compiled-in syntax
    # dump with it; no untrusted input is ever decoded.
    "RUSTSEC-2025-0141",
    # rustybuzz / ttf-parser (unmaintained): usvg's text shaping for the
    # optional PNG export of our own generated cards; fonts are the system's.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates depend on each other by path; they never publish.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
